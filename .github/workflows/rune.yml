name: Rune desktop
on:
  push:
    paths: ['rune/**', 'browser-extension/**', 'Tests/BrowserExtensionTests/**', 'scripts/browser-host.py', 'scripts/local-ai/**', '.github/workflows/rune.yml', '.gitattributes']
  pull_request:
    paths: ['rune/**', 'browser-extension/**', 'Tests/BrowserExtensionTests/**', 'scripts/browser-host.py', 'scripts/local-ai/**', '.github/workflows/rune.yml', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '14.0'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rune
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rune
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check standalone icon builder
        shell: bash
        run: |
          cargo fmt --manifest-path tools/icon-builder/Cargo.toml --check
          cargo clippy --manifest-path tools/icon-builder/Cargo.toml --target-dir target/icon-builder --locked --all-targets -- -D warnings
          cargo test --manifest-path tools/icon-builder/Cargo.toml --target-dir target/icon-builder --locked
      - name: Test dependency notices
        shell: bash
        run: |
          python packaging/test_notices.py
          python packaging/test_windows_runtime.py
      - name: Test browser, gateway and release tooling
        # Publisher checks do not read production credentials or invoke signing services.
        # The dedicated release finalizers have separate native acceptance gates.
        working-directory: .
        shell: bash
        run: |
          python rune/scripts/test_sign_update.py
          python rune/scripts/test_finalize_macos_release.py
          node Tests/BrowserExtensionTests/extract.test.js
          python scripts/local-ai/test_gateway.py
      - name: Test legacy Mac browser host framing
        if: runner.os == 'macOS'
        working-directory: .
        run: python Tests/BrowserExtensionTests/host_test.py
      - name: Render deterministic reader
        shell: bash
        run: |
          mkdir -p artifacts
          cargo run --locked -p pickle-app -- --scene sample --snap artifacts/reader.png --tree artifacts/reader-tree.json
          cargo run --locked -p pickle-app -- --scene choosing --snap artifacts/chooser.png --tree artifacts/chooser-tree.json
          cargo run --locked -p pickle-app -- --scene settings --snap artifacts/settings.png --tree artifacts/settings-tree.json
          cargo run --locked -p pickle-app -- --scene chart-bar --snap artifacts/chart-bar.png --tree artifacts/chart-bar-tree.json
          cargo run --locked -p pickle-app -- --scene chart-flow --snap artifacts/chart-flow.png --tree artifacts/chart-flow-tree.json
          cargo run --locked -p pickle-app -- --scene streaming --snap artifacts/streaming.png --tree artifacts/streaming-tree.json
          cargo run --locked -p pickle-app -- --scene consent-online --snap artifacts/consent-online.png --tree artifacts/consent-online-tree.json
      - name: Package Mac development build
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-macos.sh debug
          bash scripts/build-macos-fixture.sh
          bash native/macos/tests/run-page-fixture.sh
          bash native/macos/tests/run-invocation-fixture.sh
          bash native/macos/tests/run-window-fixture.sh
          bash native/macos/tests/run-launch-fixture.sh
      - name: Package Windows development build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          ./scripts/build-windows.ps1 -Configuration debug -Installer
          ./scripts/test-windows-package.ps1
          $stage = (Get-ChildItem artifacts/windows-* -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          ./scripts/build-msix.ps1 -StageDirectory $stage -PackageName 'Pickle.Rune.CI' -Publisher 'CN=Pickle CI Development' -PublisherDisplayName 'Pickle CI Development' -Version '0.1.0.0' -UnsignedDevelopment
          ./scripts/test-msix-package.ps1 -Package artifacts/PickleRune-x64.msix -ExpectedIdentity 'Pickle.Rune.CI'
          ./scripts/test-identity-registration.ps1
          ./scripts/test-windows-release.ps1
          ./scripts/test-signed-identity-ci.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pickle-rune-${{ runner.os }}
          if-no-files-found: warn
          path: |
            rune/artifacts/*.zip
            rune/artifacts/*setup.exe
            rune/artifacts/*.msix
            rune/artifacts/*.png
            rune/artifacts/*tree.json
            rune/artifacts/notices-*/
            rune/artifacts/*capabilities.json
            rune/artifacts/*version.txt
            rune/artifacts/*native-smoke*
            rune/artifacts/*native-*.log
            rune/artifacts/identity-ocr-result.json
            rune/artifacts/identity-ci-test-release-report.json
            rune/artifacts/windows-runtime-report.json
  optimized-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: rune
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rune
          key: optimized-package
          cache-on-failure: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Package and inspect optimized Mac build
        if: runner.os == 'macOS'
        run: |
          bash scripts/build-macos.sh release
          bash scripts/test-macos-package.sh
      - name: Package and exercise optimized Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          ./scripts/build-windows.ps1 -Configuration release -Installer
          ./scripts/test-windows-package.ps1 -Configuration release
          ./scripts/test-signed-identity-ci.ps1 -Configuration release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pickle-rune-optimized-${{ runner.os }}
          if-no-files-found: warn
          path: |
            rune/artifacts/*.zip
            rune/artifacts/*setup.exe
            rune/artifacts/*.png
            rune/artifacts/notices-*/
            rune/artifacts/*capabilities.json
            rune/artifacts/*version.txt
            rune/artifacts/*native-smoke*
            rune/artifacts/*native-*.log
            rune/artifacts/identity-ocr-result.json
            rune/artifacts/identity-ci-test-release-report.json
            rune/artifacts/windows-runtime-report.json
            rune/artifacts/macos-package-report.json
